<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Review Form</title>

    <meta name="description"
          content="Submit a product review by selecting a product, rating it, choosing useful features, and providing feedback.">

    <meta name="author"
          content="Thomas Dettmar">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>
</head>
<body>

<header>
    <h1>Product Review</h1>
</header>

<main>
    <form method="get" action="review.html">

        <div class="form-group">
            <label for="productName">Product Name *</label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>
                    Select a Product ...
                </option>
            </select>
        </div>

        <fieldset>
            <legend>Overall Rating *</legend>
                
            <label for="rating1">★</label>
            <input type="radio" id="rating1" name="rating" value="1" required>
                
            <label for="rating2">★★</label>
            <input type="radio" id="rating2" name="rating" value="2" required>
                
            <label for="rating3">★★★</label>
            <input type="radio" id="rating3" name="rating" value="3" required>
                
            <label for="rating4">★★★★</label>
            <input type="radio" id="rating4" name="rating" value="4" required>
                
            <label for="rating5">★★★★★</label>
            <input type="radio" id="rating5" name="rating" value="5" required>
        </fieldset>

        <div class="form-group">
            <label for="installDate">Date of Installation *</label>
            <input
                type="date"
                id="installDate"
                name="installDate"
                required>
        </div>

        <fieldset class="features">

            <legend>
                Which features did you find useful in the product?
                <br>
                <em>(Check all that apply)</em>
            </legend>
        
            <label for="durability">
                <input type="checkbox"
                       id="durability"
                       name="features"
                       value="Durability">
                Durability
            </label>
        
            <label for="easeOfUse">
                <input type="checkbox"
                       id="easeOfUse"
                       name="features"
                       value="Ease of Use">
                Ease of Use
            </label>
        
            <label for="performance">
                <input type="checkbox"
                       id="performance"
                       name="features"
                       value="Performance">
                Performance
            </label>
        
            <label for="design">
                <input type="checkbox"
                       id="design"
                       name="features"
                       value="Design">
                Design
            </label>
        
        </fieldset>

        <div class="form-group">
            <label for="review">Written Review</label>
            <textarea
                id="review"
                name="review"
                rows="5"></textarea>
        </div>

        <div class="form-group">
            <label for="username">User Name</label>
            <input
                type="text"
                id="username"
                name="username">
        </div>

        <input type="submit" value="Submit Review">

    </form>
</main>

<footer>
    <p>&copy; 2026 Thomas Dettmar | WDD 131</p>
</footer>

</body>
</html>
