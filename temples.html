<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Album</title>
    <meta name="description" content="A responsive temple photo album showcasing various temples from around the world.">
    <meta name="author" content="Thomas Dettmar">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">

    <script src="scripts/temples.js" defer></script>
</head>

<body>

<header>
    <h2>Temple Album</h2>

    <button id="menuBtn">☰</button>

    <nav id="navMenu">
        <a href="#">Home</a>
        <a href="#">Old</a>
        <a href="#">New</a>
        <a href="#">Large</a>
        <a href="#">Small</a>
    </nav>
</header>

<main>
    <h1>Home</h1>

    <div class="gallery">
        <figure>
            <img src="images/gilbert-arizona-temple.jpg" alt="Gilbert Arizona Temple">
            <figcaption>Gilbert Arizona</figcaption>
        </figure>

        <figure>
            <img src="images/mesa-arizona-temple.jpg" alt="Mesa Arizona Temple">
            <figcaption>Mesa Arizona</figcaption>
        </figure>

        <figure>
            <img src="images/phoenix-arizona-temple.jpg" alt="Phoenix Arizona Temple">
            <figcaption>Phoenix Arizona</figcaption>
        </figure>

        <figure>
            <img src="images/tucson-arizona-temple.jpg" alt="Tucson Arizona Temple">
            <figcaption>Tucson Arizona</figcaption>
        </figure>

        <figure>
            <img src="images/salt-lake-city-utah-temple.jpg" alt="Salt Lake City Utah Temple">
            <figcaption>Salt Lake City Utah</figcaption>
        </figure>

        <figure>
            <img src="images/oakland-california-temple.jpg" alt="Oakland California Temple">
            <figcaption>Oakland California</figcaption>
        </figure>

        <figure>
            <img src="images/san-diego-california-temple.jpg" alt="San Diego California Temple">
            <figcaption>San Diego California</figcaption>
        </figure>

        <figure>
            <img src="images/freiberg-germany-temple.jpg" alt="Freiberg Germany Temple">
            <figcaption>Freiberg Germany</figcaption>
        </figure>

        <figure>
            <img src="images/papeete-tahiti-temple.jpg" alt="Papeete Tahiti Temple">
            <figcaption>Papeete Tahiti</figcaption>
        </figure>
    </div>
</main>

<footer>
    <p>© <span id="year"></span> Thomas Dettmar - Arizona</p>
    <p id="lastModified"></p>
</footer>

</body>
</html>
